packages:
  - packages/*
  - native/*

allowBuilds:
  '@electron/rebuild': true
  electron: true
  electron-winstaller: true
  esbuild: true
  zeromq: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.4'
  - '@tanstack/react-query@5.104.4'
  - '@kunstmusik/codemirror-lang-csound@1.0.4'

packageExtensions:
  vite-plugin-electron@0.29.1:
    peerDependencies:
      vite: ^7.3.2
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.7.0
  '@vitest/browser-playwright': 5.1.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: '*'
