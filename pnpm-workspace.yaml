packages:
  - packages/*
  - native/*

allowBuilds:
  '@electron/rebuild': true
  electron: true
  electron-winstaller: true
  esbuild: true
  zeromq: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.4'
  - '@tanstack/react-query@5.104.4'

packageExtensions:
  vite-plugin-electron@0.29.1:
    peerDependencies:
      vite: ^7.3.2
