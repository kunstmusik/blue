# Tag-triggered stable release workflow.
#
# Triggered by an immutable `vX.Y.Z` tag that must match
# packages/blue-app/package.json. Validates version agreement, then packages
# each native target as an unsigned build. Signing and notarization are
# intentionally reserved for a future release policy; the current workflow
# does not require or consume Apple or Azure signing credentials.
#
# A final promoter job downloads all expected artifacts, validates the
# consolidated manifest, creates a draft release, attaches platform ZIPs and
# checksums, and publishes one public GitHub Release only when the complete
# asset set is verified.
#
# Security contract:
#   - Package jobs use read-only repository access and no production signing
#     credentials.
#   - The protected `release` Environment gates only final publication.
#   - The promoter job is the only job that receives `contents: write`.
#   - No platform job publishes a release. Only the promoter does, and only
#     after the manifest validates the complete asset set.
name: Stable Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: validate-version
    runs-on: ubuntu-22.04
    outputs:
      app-version: ${{ steps.version.outputs.app-version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bootstrap workspace
        uses: ./.github/actions/setup-blue-build
        with:
          build-java-runtime: 'false'
          build-workspace: 'false'
          rebuild-native: 'false'

      - name: Validate tag/version agreement and duplicate publication
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm --filter @blue/app verify:release-version -- \
            --repository ${{ github.repository }}
          APP_VERSION=$(node -e "console.log(require('./packages/blue-app/package.json').version)")
          {
            echo "app-version=${APP_VERSION}"
            echo "tag=${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"

  package-macos:
    name: package (macos-${{ matrix.arch }})
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            package-script: package:macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bootstrap workspace
        uses: ./.github/actions/setup-blue-build

      - name: Verify package inputs
        run: pnpm verify:package-inputs

      - name: Build unsigned macOS package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm --filter @blue/app ${{ matrix.package-script }}

      - name: Verify packaged app (smoke)
        run: |
          pnpm --filter @blue/app verify:packaged-app -- --no-playwright

      - name: Create stable release ZIP
        working-directory: packages/blue-app/release
        env:
          APP_VERSION: ${{ needs.validate-version.outputs.app-version }}
        run: |
          installer="Blue-${APP_VERSION}-arm64.dmg"
          bundle="blue-macos-arm64-${APP_VERSION}.zip"
          test -f "$installer"
          zip -j "$bundle" "$installer"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: blue-macos-${{ matrix.arch }}-${{ needs.validate-version.outputs.app-version }}.zip
          path: packages/blue-app/release/blue-macos-${{ matrix.arch }}-${{ needs.validate-version.outputs.app-version }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  package-windows:
    name: package (windows-x64)
    needs: validate-version
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bootstrap workspace
        uses: ./.github/actions/setup-blue-build

      - name: Verify package inputs
        run: pnpm verify:package-inputs

      - name: Build unsigned Windows installer
        run: |
          pnpm --filter @blue/app package:windows-x64

      - name: Verify packaged app (smoke)
        run: |
          pnpm --filter @blue/app verify:packaged-app -- --no-playwright

      - name: Create stable release ZIP
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.validate-version.outputs.app-version }}
        run: |
          $installer = "packages/blue-app/release/Blue-Setup-$env:APP_VERSION.exe"
          $bundle = "packages/blue-app/release/blue-windows-x64-$env:APP_VERSION.zip"
          if (-not (Test-Path -PathType Leaf $installer)) {
            throw "Expected Windows installer not found: $installer"
          }
          Compress-Archive -Path $installer -DestinationPath $bundle

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: blue-windows-x64-${{ needs.validate-version.outputs.app-version }}.zip
          path: packages/blue-app/release/blue-windows-x64-${{ needs.validate-version.outputs.app-version }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  package-linux:
    name: package (linux-x64)
    needs: validate-version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bootstrap workspace
        uses: ./.github/actions/setup-blue-build

      - name: Verify package inputs
        run: pnpm verify:package-inputs

      - name: Build Linux packages
        run: |
          pnpm --filter @blue/app package:linux-x64

      - name: Verify packaged app (smoke)
        run: |
          pnpm --filter @blue/app verify:packaged-app -- --no-playwright

      - name: Create stable release ZIP
        working-directory: packages/blue-app/release
        env:
          APP_VERSION: ${{ needs.validate-version.outputs.app-version }}
        run: |
          appimage="Blue-${APP_VERSION}.AppImage"
          deb="Blue_${APP_VERSION}_amd64.deb"
          bundle="blue-linux-x64-${APP_VERSION}.zip"
          test -f "$appimage"
          test -f "$deb"
          zip -j "$bundle" "$appimage" "$deb"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: blue-linux-x64-${{ needs.validate-version.outputs.app-version }}.zip
          path: packages/blue-app/release/blue-linux-x64-${{ needs.validate-version.outputs.app-version }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  publish-stable:
    name: publish-stable
    needs: [validate-version, package-macos, package-windows, package-linux]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download all package artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: blue-*-${{ needs.validate-version.outputs.app-version }}.zip

      - name: Consolidate and verify the exact release asset set
        env:
          APP_VERSION: ${{ needs.validate-version.outputs.app-version }}
        run: |
          mkdir -p consolidated
          expected=(
            "blue-macos-arm64-${APP_VERSION}.zip"
            "blue-windows-x64-${APP_VERSION}.zip"
            "blue-linux-x64-${APP_VERSION}.zip"
          )
          for asset in "${expected[@]}"; do
            mapfile -t matches < <(find release-assets -type f -name "$asset" -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one $asset, found ${#matches[@]}"
              exit 1
            fi
            cp "${matches[0]}" consolidated/
          done
          mapfile -t actual < <(find release-assets -type f -name 'blue-*.zip' -print)
          if [ "${#actual[@]}" -ne "${#expected[@]}" ]; then
            echo "Unexpected or duplicate release ZIPs were downloaded:"
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          ls -la consolidated

      - name: Generate consolidated manifest
        env:
          APP_VERSION: ${{ needs.validate-version.outputs.app-version }}
        run: |
          node scripts/release-artifact-manifest.mjs generate \
            --out consolidated/release-manifest.json \
            --release-dir consolidated \
            --checksums-out consolidated/checksums-sha256.txt \
            --asset-mode bundles \
            --verification-status verified \
            --app-version "$APP_VERSION" \
            --source-revision ${{ github.sha }}

      - name: Validate the consolidated manifest
        env:
          APP_VERSION: ${{ needs.validate-version.outputs.app-version }}
        run: |
          node scripts/release-artifact-manifest.mjs validate \
            --manifest consolidated/release-manifest.json \
            --asset-mode bundles \
            --require-verified \
            --app-version "$APP_VERSION" \
            --source-revision ${{ github.sha }} \
            --expected-targets macos-arm64,windows-x64,linux-x64

      - name: Compose release body
        id: body
        run: |
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "Source revision: \`${{ github.sha }}\`"
            echo ""
            echo "macOS: **unsigned** DMG in \`blue-macos-arm64-${{ needs.validate-version.outputs.app-version }}.zip\`."
            echo "Windows: **unsigned** NSIS installer in \`blue-windows-x64-${{ needs.validate-version.outputs.app-version }}.zip\`."
            echo "Linux: AppImage and Debian package in \`blue-linux-x64-${{ needs.validate-version.outputs.app-version }}.zip\`."
            echo ""
            echo "## Installation"
            echo ""
            echo "**macOS**: the DMG is unsigned. Right-click the Blue app and choose **Open**, or go to **System Settings → Privacy & Security → Open Anyway**."
            echo ""
            echo "**Windows**: the installer is unsigned. SmartScreen will show \"Windows protected your PC.\" Click **More info → Run anyway**."
            echo ""
            echo "**Linux**: install the \`.deb\` or mark the \`.AppImage\` as executable (\`chmod +x\`) and launch."
            echo ""
            echo "## Runtime prerequisites"
            echo ""
            echo "Install **Java 17+**, **Csound 7**, and **\`blue-engine\`** separately for audio playback. They are not bundled."
            echo ""
            echo "## Verification"
            echo ""
            echo "See \`checksums-sha256.txt\` and \`release-manifest.json\` for per-asset SHA-256 values."
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Blue ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: ${{ steps.body.outputs.body }}
          generate_release_notes: true
          files: |
            consolidated/blue-*.zip
            consolidated/checksums-sha256.txt
            consolidated/release-manifest.json
          fail_on_unmatched_files: true

      - name: Publish the release (un-draft)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Convert the draft into a public release now that every required
          # asset has been uploaded and verified. `gh release edit` accepts
          # the tag name as the release identifier.
          gh release edit "${{ github.ref_name }}" --draft=false
