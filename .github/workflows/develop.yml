# Develop branch build.
#
# Triggered on push to develop. Builds, tests, and packages the full platform
# matrix. Uploads each native installer as a direct artifact so testers can
# download them from the Actions run. No GitHub Release is created.
#
# Artifact naming: blue-{os}-{cputype}-{version}-{short-sha}.{ext}
#   e.g. blue-linux-x64-0.0.1-abc1234.AppImage
name: Develop

on:
  push:
    branches: [develop]

concurrency:
  group: develop-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-package:
    name: ${{ matrix.target-id }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target-id: macos-arm64
            runs-on: macos-14
            package-script: package:macos-arm64
          - target-id: windows-x64
            runs-on: windows-2022
            package-script: package:windows-x64
          - target-id: linux-x64
            runs-on: ubuntu-22.04
            package-script: package:linux-x64

    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bootstrap workspace
        uses: ./.github/actions/setup-blue-build

      - name: Read app version and short SHA
        id: meta
        shell: bash
        run: |
          APP_VERSION=$(node -e "console.log(require('./packages/blue-app/package.json').version)")
          SHORT_SHA=$(git rev-parse --short HEAD)
          {
            echo "app-version=${APP_VERSION}"
            echo "short-sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify package inputs
        shell: bash
        run: pnpm verify:package-inputs

      - name: Run workspace tests
        shell: bash
        run: pnpm test

      - name: Lint
        shell: bash
        run: pnpm lint

      - name: Build package (${{ matrix.target-id }})
        shell: bash
        run: pnpm --filter @blue/app ${{ matrix.package-script }}

      - name: Verify packaged app (smoke)
        if: runner.os != 'Linux'
        shell: bash
        run: pnpm --filter @blue/app verify:packaged-app -- --no-playwright

      - name: Verify packaged app (smoke, Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum pnpm --filter @blue/app verify:packaged-app -- --no-playwright

      - name: Stage installer artifacts
        shell: bash
        env:
          APP_VERSION: ${{ steps.meta.outputs.app-version }}
          TARGET_ID: ${{ matrix.target-id }}
          VERSION_INFO: ${{ steps.meta.outputs.app-version }}-${{ steps.meta.outputs.short-sha }}
        run: |
          staging="packages/blue-app/release/artifacts"
          mkdir -p "$staging"
          case "$TARGET_ID" in
            macos-arm64)
              cp "packages/blue-app/release/Blue-${APP_VERSION}-arm64.dmg" \
                "$staging/blue-${TARGET_ID}-${VERSION_INFO}.dmg"
              ;;
            windows-x64)
              cp "packages/blue-app/release/Blue-Setup-${APP_VERSION}.exe" \
                "$staging/blue-${TARGET_ID}-${VERSION_INFO}.exe"
              ;;
            linux-x64)
              cp "packages/blue-app/release/Blue-${APP_VERSION}.AppImage" \
                "$staging/blue-${TARGET_ID}-${VERSION_INFO}.AppImage"
              cp "packages/blue-app/release/Blue_${APP_VERSION}_amd64.deb" \
                "$staging/blue-${TARGET_ID}-${VERSION_INFO}.deb"
              ;;
            *)
              echo "Unsupported package target: $TARGET_ID"
              exit 1
              ;;
          esac

      - name: Upload macOS installer
        if: matrix.target-id == 'macos-arm64'
        uses: actions/upload-artifact@v7
        with:
          path: packages/blue-app/release/artifacts/blue-macos-arm64-${{ steps.meta.outputs.app-version }}-${{ steps.meta.outputs.short-sha }}.dmg
          archive: false
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload Windows installer
        if: matrix.target-id == 'windows-x64'
        uses: actions/upload-artifact@v7
        with:
          path: packages/blue-app/release/artifacts/blue-windows-x64-${{ steps.meta.outputs.app-version }}-${{ steps.meta.outputs.short-sha }}.exe
          archive: false
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload Linux AppImage
        if: matrix.target-id == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          path: packages/blue-app/release/artifacts/blue-linux-x64-${{ steps.meta.outputs.app-version }}-${{ steps.meta.outputs.short-sha }}.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload Linux Debian package
        if: matrix.target-id == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          path: packages/blue-app/release/artifacts/blue-linux-x64-${{ steps.meta.outputs.app-version }}-${{ steps.meta.outputs.short-sha }}.deb
          archive: false
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blue-${{ matrix.target-id }}-${{ steps.meta.outputs.app-version }}-${{ steps.meta.outputs.short-sha }}-diagnostics.zip
          path: |
            packages/blue-app/release/*.yml
            packages/blue-app/release/*.blockmap
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
