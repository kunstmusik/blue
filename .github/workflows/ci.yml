# Native-platform CI matrix for pull requests and integration branches.
#
# Replaces the previous macOS-only workflow with explicit per-target jobs so
# the release contract (macOS x64/arm64, Windows x64, Linux x64) is exercised
# on every change. The matrix runs the full repository build/test/lint plus
# an unsigned directory package, packaged-app smoke verification, and a
# machine-readable release manifest.
#
# Security contract:
#   - Read-only `contents: read` GITHUB_TOKEN for the whole workflow.
#   - No protected `release` Environment reference.
#   - No production signing credentials.
#   - Forked pull requests retain identical secret-free validation.
#   - Artifacts are uploaded with `if: always()` so failures are diagnosable.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Cancel superseded runs on the same ref so the matrix stays responsive and
# does not burn macOS/Windows runner capacity on stale commits.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least-privilege default: only read access. Publisher jobs in the dev/stable
# release workflows override this where necessary.
permissions:
  contents: read

jobs:
  build-test-package:
    name: ${{ matrix.target-id }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target-id: macos-x64
            runs-on: macos-13
            electron-arch: x64
            package-script: package:macos-x64
          - target-id: macos-arm64
            runs-on: macos-14
            electron-arch: arm64
            package-script: package:macos-arm64
          - target-id: windows-x64
            runs-on: windows-2022
            electron-arch: x64
            package-script: package:windows-x64
          - target-id: linux-x64
            runs-on: ubuntu-22.04
            electron-arch: x64
            package-script: package:linux-x64

    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap workspace
        uses: ./.github/actions/setup-blue-build

      - name: Verify package inputs
        shell: bash
        run: |
          pnpm verify:package-inputs

      - name: Run workspace tests
        shell: bash
        run: |
          pnpm test

      - name: Run focused app tests
        shell: bash
        run: |
          pnpm --filter @blue/app exec vitest run \
            --config vitest.config.ts \
            src/main/java-runtime/java-runtime-path.test.ts \
            src/main/packaged-runtime-verification.test.ts

      - name: Lint
        shell: bash
        run: |
          pnpm lint

      - name: Build unsigned package (${{ matrix.target-id }})
        shell: bash
        run: |
          pnpm --filter @blue/app ${{ matrix.package-script }}

      - name: Generate release manifest
        shell: bash
        run: |
          pnpm --filter @blue/app release:manifest

      - name: Verify packaged app (smoke)
        shell: bash
        # Windows runners can launch the unpacked exe directly. macOS and
        # Linux runners use the helper's platform-default lookup.
        run: |
          pnpm --filter @blue/app verify:packaged-app -- --no-playwright

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target-id }}
          path: |
            packages/blue-app/release/
            packages/blue-app/release/release-manifest.json
            packages/blue-app/release/release-manifest.json.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Upload redacted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.target-id }}
          path: |
            packages/blue-app/release/*.log
            packages/blue-app/release/*.yml
          if-no-files-found: ignore
          retention-days: 7
