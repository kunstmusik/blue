# Development prerelease workflow.
#
# Builds the scheduled main revision, or the branch/SHA selected by manual
# dispatch, into a single clearly labeled GitHub prerelease. Consumes the
# shared bootstrap action and the artifact manifest contract so it never
# publishes from a partial target set.
#
# Security contract:
#   - The matrix jobs have only `contents: read` (the workflow default).
#   - Only the final prerelease-publisher job gets `contents: write`.
#   - No production signing credentials are referenced. The release is
#     unsigned by design and says so in its generated notes.
#   - No protected `release` Environment is referenced. Development builds
#     remain independent of the stable-release policy.
name: Dev Release

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      source-revision:
        description: 'Optional branch, tag, or commit SHA to build (defaults to the selected workflow ref)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  build-package:
    name: package (${{ matrix.target-id }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-id: macos-x64
            runs-on: macos-13
            package-script: package:macos-x64
          - target-id: macos-arm64
            runs-on: macos-14
            package-script: package:macos-arm64
          - target-id: windows-x64
            runs-on: windows-2022
            package-script: package:windows-x64
          - target-id: linux-x64
            runs-on: ubuntu-22.04
            package-script: package:linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source-revision || github.ref }}

      - name: Bootstrap workspace
        uses: ./.github/actions/setup-blue-build

      - name: Verify package inputs
        run: pnpm verify:package-inputs

      - name: Build unsigned package (${{ matrix.target-id }})
        run: pnpm --filter @blue/app ${{ matrix.package-script }}

      - name: Generate release manifest
        run: pnpm --filter @blue/app release:manifest

      - name: Verify packaged app (smoke)
        run: pnpm --filter @blue/app verify:packaged-app -- --no-playwright

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-release-${{ matrix.target-id }}
          path: |
            packages/blue-app/release/
            packages/blue-app/release/release-manifest.json
            packages/blue-app/release/release-manifest.json.sha256
          if-no-files-found: warn
          retention-days: 14

  publish-prerelease:
    name: publish-prerelease
    needs: build-package
    runs-on: ubuntu-22.04
    # Only the publisher job gets release-content authority. It still never
    # receives signing credentials.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source-revision || github.ref }}
          # Pull full history so release-metadata can resolve the SHA.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute release metadata
        id: metadata
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          node scripts/release-metadata.mjs \
            --out release-metadata.json \
            --channel development \
            --source-revision "$SOURCE_SHA"
          APP_VERSION=$(node -e "console.log(require('./release-metadata.json').appVersion)")
          VERSION=$(node -e "console.log(require('./release-metadata.json').releaseVersion)")
          NAME=$(node -e "console.log(require('./release-metadata.json').releaseName)")
          NOTES=$(node -e "console.log(require('./release-metadata.json').releaseNotes)")
          {
            echo "app-version=${APP_VERSION}"
            echo "version=${VERSION}"
            echo "name=${NAME}"
            echo "sha=${SOURCE_SHA}"
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dev-release-*

      - name: Consolidate artifacts into a single release directory
        env:
          APP_VERSION: ${{ steps.metadata.outputs.app-version }}
        run: |
          mkdir -p consolidated
          find release-assets -type f -print | while read -r f; do
            base=$(basename "$f")
            case "$base" in
              *"$APP_VERSION"*.dmg|*"$APP_VERSION"*.exe|*"$APP_VERSION"*.AppImage|*"$APP_VERSION"*.deb)
                cp "$f" consolidated/
                ;;
            esac
          done
          ls -la consolidated

      - name: Validate complete prerelease asset set
        run: |
          node scripts/release-artifact-manifest.mjs generate \
            --out consolidated/release-manifest.json \
            --release-dir consolidated \
            --source-revision ${{ steps.metadata.outputs.sha }}
          node scripts/release-artifact-manifest.mjs validate \
            --manifest consolidated/release-manifest.json \
            --expected-targets macos-x64,macos-arm64,windows-x64,linux-x64

      - name: Compute checksum manifest
        run: |
          sha256sum consolidated/* > consolidated/checksums-sha256.txt || true

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@c062e08bd532815e2082a85da87aa8ebcc39d746
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          name: ${{ steps.metadata.outputs.name }}
          prerelease: true
          body: ${{ steps.metadata.outputs.notes }}
          files: |
            consolidated/*
            release-metadata.json
          generate_release_notes: true
          fail_on_unmatched_files: true
