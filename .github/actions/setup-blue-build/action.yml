name: setup-blue-build
description: |
  Shared build bootstrap for Blue Electron pull-request, develop, and stable release
  workflows. Installs pinned Node, pnpm, Java, and Maven-compatible tooling,
  restores the pnpm/vcpkg caches, installs from the lockfile, and builds the
  native engine plus Java helper before any Electron package consumer runs.

  The caller must checkout the desired source ref before invoking this action;
  the action intentionally preserves that checkout so workflow_dispatch builds
  can target an explicit branch or SHA.

  Keep every workflow's setup identical so package matrices produce
  comparable evidence across macOS arm64, Windows x64, and Linux x64
  runners.

inputs:
  node-version:
    description: Pinned Node.js major version (must match the Electron 35.7.5 embedded Node runtime contract).
    required: false
    default: '22'
  pnpm-version:
    description: Pinned pnpm major version.
    required: false
    default: '10'
  java-version:
    description: Java major version for the @blue/java-runtime Maven build.
    required: false
    default: '17'
  build-java-runtime:
    description: Whether to build @blue/java-runtime (JAR + pythonLib) before returning.
    required: false
    default: 'true'
  build-workspace:
    description: Whether to run `pnpm build` (workspace-wide TypeScript build) before returning.
    required: false
    default: 'true'
  rebuild-native:
    description: Whether to rebuild native modules for the target Electron runtime before returning.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm ${{ inputs.pnpm-version }}
      uses: pnpm/action-setup@v5
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Restore pinned vcpkg checkout
      id: vcpkg-cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/blue-vcpkg-9d7f79f5
        key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-9d7f79f56ae1a9b4704d6a7fb8237e347a974133

    - name: Checkout pinned vcpkg (Unix)
      if: steps.vcpkg-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        git clone https://github.com/microsoft/vcpkg.git \
          "${RUNNER_TEMP}/blue-vcpkg-9d7f79f5"
        git -C "${RUNNER_TEMP}/blue-vcpkg-9d7f79f5" checkout \
          9d7f79f56ae1a9b4704d6a7fb8237e347a974133
        "${RUNNER_TEMP}/blue-vcpkg-9d7f79f5/bootstrap-vcpkg.sh" -disableMetrics

    - name: Checkout pinned vcpkg (Windows)
      if: steps.vcpkg-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        git clone https://github.com/microsoft/vcpkg.git `
          "$env:RUNNER_TEMP/blue-vcpkg-9d7f79f5"
        git -C "$env:RUNNER_TEMP/blue-vcpkg-9d7f79f5" checkout `
          9d7f79f56ae1a9b4704d6a7fb8237e347a974133
        & "$env:RUNNER_TEMP/blue-vcpkg-9d7f79f5/bootstrap-vcpkg.bat" -disableMetrics

    - name: Export pinned vcpkg root
      shell: bash
      run: |
        echo "VCPKG_ROOT=${RUNNER_TEMP}/blue-vcpkg-9d7f79f5" >> "$GITHUB_ENV"

    - name: Restore Blue Engine vcpkg packages
      uses: actions/cache@v5
      with:
        path: native/blue-engine/vcpkg_installed
        key: ${{ runner.os }}-${{ runner.arch }}-blue-engine-vcpkg-${{ hashFiles('native/blue-engine/vcpkg.json', 'native/blue-engine/vcpkg-configuration.json', 'native/blue-engine/triplets/*') }}

    - name: Resolve pnpm store path
      shell: bash
      run: |
        echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - name: Restore pnpm store cache
      uses: actions/cache@v5
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

    - name: Setup Java ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven

    - name: Install workspace dependencies (frozen lockfile)
      shell: bash
      run: |
        pnpm install --frozen-lockfile

    - name: Build @blue/java-runtime
      if: ${{ inputs.build-java-runtime == 'true' }}
      shell: bash
      run: |
        pnpm --filter @blue/java-runtime build

    - name: Verify Java helper artifacts
      if: ${{ inputs.build-java-runtime == 'true' }}
      shell: bash
      run: |
        test -f packages/blue-app/assets/java/blue-java.jar || { \
          echo '@blue/java-runtime build did not produce packages/blue-app/assets/java/blue-java.jar'; \
          exit 1; \
        }
        test -d packages/blue-app/assets/java/pythonLib || { \
          echo '@blue/java-runtime build did not produce packages/blue-app/assets/java/pythonLib'; \
          exit 1; \
        }

    - name: Build workspace from one revision
      if: ${{ inputs.build-workspace == 'true' }}
      shell: bash
      run: |
        pnpm build
        pnpm --filter @blue/engine-native verify

    - name: Rebuild native zeromq for the target Electron runtime
      if: ${{ inputs.rebuild-native == 'true' }}
      shell: bash
      run: |
        pnpm --filter @blue/app rebuild:native
